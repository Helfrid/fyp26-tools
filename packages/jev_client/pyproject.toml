[project]
name = "jev-client"
version = "0.1.0"
description = "Budget-guarded client for the Jev (TypeSafe System One) typed-question API"
readme = "README.md"
authors = [{ name = "hh65", email = "hh65@sussex.ac.uk" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "loguru>=0.7.3",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
